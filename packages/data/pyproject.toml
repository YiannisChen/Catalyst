[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalyst-data"
version = "0.1.0"
description = "Financial data ingestion, cleaning, and Markdown conversion for AI agents"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yiannis Chen" }]

dependencies = [
    "httpx>=0.27",
    "requests>=2.31",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.scripts]
catalyst-daily = "catalyst_data.ingestion.ops.daily:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.20",
    "pandas>=2.0",
    "transformers>=5,<6",
    "yfinance>=0.2",
    "psutil>=5.9",
]
ingest = [
    "openai>=1.0",  # DeepSeek news categories (categorize_llm)
    "beautifulsoup4>=4.12",
    "yfinance>=0.2",
]
vector = [
    "lancedb==0.30.2",
    "FlagEmbedding>=1.2",
    "nltk==3.9.1",
]

[tool.hatch.build.targets.wheel]
packages = ["catalyst_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
