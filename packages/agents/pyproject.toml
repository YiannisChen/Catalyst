[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalyst-agents"
version = "0.1.0"
description = "Evidence-bounded attribution workflow for Catalyst"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yiannis Chen" }]

dependencies = [
    "catalyst-data>=0.1.0",
    "langgraph>=1.2,<2",
    "openai>=2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "langchain-openai>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["catalyst_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
