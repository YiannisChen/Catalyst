# Install in /etc/nginx/conf.d/catalyst-api.conf. The generated
# catalyst-cloudflare-allow.conf is loaded separately in nginx's http context.
limit_req_zone $binary_remote_addr zone=catalyst_api:10m rate=30r/s;
map "$request_method:$uri" $catalyst_run_rate_key {
    default "";
    ~^POST:/api/live-runs(?:/[^/]+/cancel)?$ $binary_remote_addr;
    ~^POST:/api/data/refresh$ $binary_remote_addr;
}
limit_req_zone $catalyst_run_rate_key zone=catalyst_run:10m rate=2r/m;

server {
    listen 8443 ssl http2;
    server_name catalyst.yiannischen.dev;

    ssl_certificate /etc/ssl/catalyst/origin.pem;
    ssl_certificate_key /etc/ssl/catalyst/origin.key;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    if ($catalyst_cloudflare_peer = 0) { return 444; }

    root /opt/catalyst/web;
    index index.html;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com" always;

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/live-runs {
        limit_req zone=catalyst_api burst=60 nodelay;
        limit_req zone=catalyst_run burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/api/live-runs/[^/]+/cancel$ {
        limit_req zone=catalyst_api burst=60 nodelay;
        limit_req zone=catalyst_run burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/data/refresh {
        limit_req zone=catalyst_api burst=60 nodelay;
        limit_req zone=catalyst_run burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/api/live-runs/[^/]+/stream$ {
        limit_req zone=catalyst_api burst=60 nodelay;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        limit_req zone=catalyst_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
