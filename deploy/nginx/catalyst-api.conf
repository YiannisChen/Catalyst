# Install in nginx http{} context; generated allow list must be updated from cloudflare_ips.txt.
limit_req_zone $binary_remote_addr zone=catalyst_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=catalyst_run:10m rate=2r/m;

server {
    listen 443 ssl;
    server_name catalyst.example.com; # Replace with the deployed API hostname.
    ssl_certificate /etc/letsencrypt/live/catalyst.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalyst.example.com/privkey.pem;
    include /etc/nginx/catalyst-cloudflare-allow.conf;
    real_ip_header CF-Connecting-IP;
    # Trust only Cloudflare networks listed in the generated include.
    # Update generator should also produce set_real_ip_from directives.
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;

    location ^~ /api/live-runs {
        limit_req zone=catalyst_run burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
    location = /api/data/update {
        limit_req zone=catalyst_run burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
    location = /api/data/refresh {
        limit_req zone=catalyst_run burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
    location / {
        limit_req zone=catalyst_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
}
