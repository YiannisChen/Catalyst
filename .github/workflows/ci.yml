name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      # The chunker tests use the pinned BGE-M3 tokenizer (tokenizer files only, no model weights).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-tokenizer-5617a9f61b028005a4858fdac845db406aefb181
      - name: Fetch the pinned tokenizer
        env:
          PYTHONPATH: packages/data
        run: python -c "from catalyst_data.corpus.tokenizer import get_tokenizer; get_tokenizer()"
      - name: Runtime tests
        env:
          PYTHONPATH: packages/data:packages/agents:packages/api:scripts
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          status=0
          for tests in packages/data/tests packages/agents/tests packages/api/tests deploy/monitor/tests deploy/api/tests deploy/ops/tests; do
            python -m pytest "$tests" -q --disable-warnings -rfE 2>&1 | tee -a pytest.log
            [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          done
          # Surface each failing test as an annotation, readable without opening the log.
          grep -E "^(FAILED|ERROR) " pytest.log | head -30 | sed 's/^/::error title=pytest::/' || true
          exit $status
      - run: python scripts/check_ruff.py
      - run: lint-imports --config pyproject.toml --no-logo

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npx vite build
        working-directory: apps/web
