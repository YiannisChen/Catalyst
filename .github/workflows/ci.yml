name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Runtime tests
        env:
          PYTHONPATH: packages/data:packages/agents:packages/api:scripts
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          for tests in packages/data/tests packages/agents/tests packages/api/tests deploy/monitor/tests deploy/api/tests; do
            python -m pytest "$tests" -q --disable-warnings
          done
      - run: python scripts/check_ruff.py
      - run: lint-imports --config pyproject.toml --no-logo

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npx vite build
        working-directory: apps/web
